openapi: 3.1.0
info:
  title: Java AI Agent API
  version: 1.0.0
  description: |
    API for checking service health and streaming chat responses.
servers:
  - url: http://localhost:7070
    description: Local development server
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
              example:
                status: ok

  /api/chat/stream:
    post:
      operationId: streamChat
      summary: Stream a chat response
      description: |
        Returns the Server-Sent Events (SSE) stream shown in the response
        example for the request shown below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rawQuery
              properties:
                conversationId:
                  type:
                    - string
                    - "null"
                  description: |
                    Existing conversation ID. Omit, set to null, or use an
                    empty string to start a new conversation.
                rawQuery:
                  type: string
                  description: The user's message.
            example:
              conversationId: ""
              rawQuery: what about the eviction policy of db
      responses:
        "200":
          description: SSE response stream.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                completeNewConversation:
                  summary: Observed response for the example request
                  value: |-
                    event: conversationId
